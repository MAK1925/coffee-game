<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кофейня: Империя с нуля</title>
    <style>
        /* Стили встроены прямо сюда, чтобы не было проблем с подключением файлов */
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #2c2c2c;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        #game-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Сцена */
        #game-scene {
            position: relative;
            width: 100%;
            height: 300px;
            background-color: #e0e0e0;
            overflow: hidden;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 3px solid #555;
        }

        /* Прилавок */
        #counter {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background-color: #8B4513;
            z-index: 10;
            border-top: 3px solid #5c2e0b;
        }

        /* Слой для динамических элементов */
        #entities-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Покупатель */
        .customer {
            position: absolute;
            bottom: 80px;
            width: 40px;
            height: 80px;
            background-color: #3498db;
            border-radius: 10px 10px 0 0;
            transition: left 2s linear;
            z-index: 5;
        }

        /* Стакан с кофе */
        .cup {
            position: absolute;
            bottom: 80px;
            width: 20px;
            height: 30px;
            background-color: white;
            border: 2px solid #333;
            border-radius: 0 0 5px 5px;
            z-index: 15;
        }

        /* Всплывающий текст цены */
        .floating-text {
            position: absolute;
            color: #2ecc71;
            font-weight: bold;
            font-size: 20px;
            text-shadow: 1px 1px 2px black;
            animation: floatUp 1.5s ease-out forwards;
            z-index: 20;
        }

        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-50px); opacity: 0; }
        }

        /* Панель управления */
        #ui-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background-color: #444;
            padding: 15px;
            border-radius: 10px;
            box-sizing: border-box;
        }

        #balance {
            font-size: 24px;
            font-weight: bold;
            color: #f1c40f;
        }

        #start-day-btn {
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 8px;
            transition: background-color 0.3s;
        }

        #start-day-btn:disabled {
            background-color: #7f8c8d;
            cursor: not-allowed;
        }

        #start-day-btn:active:not(:disabled) {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Сцена -->
        <div id="game-scene">
            <div id="counter"></div>
            <div id="entities-layer"></div>
        </div>

        <!-- Панель управления -->
        <div id="ui-panel">
            <div>💰 Баланс: <span id="balance">0</span></div>
            <button id="start-day-btn">Начать день</button>
        </div>
    </div>

    <script>
        // --- Логика игры ---
        let balance = 0;
        let isDayRunning = false;
        let customerInterval;

        const balanceEl = document.getElementById('balance');
        const startBtn = document.getElementById('start-day-btn');
        const entitiesLayer = document.getElementById('entities-layer');

        // Старт дня
        startBtn.addEventListener('click', () => {
            if (isDayRunning) return;
            isDayRunning = true;
            startBtn.disabled = true;
            startBtn.innerText = "День идет...";
            
            // Спавним покупателя каждые 3 секунды
            customerInterval = setInterval(spawnCustomer, 3000);
            
            // (Опционально) Можно добавить остановку дня через 30 секунд
            setTimeout(() => {
                clearInterval(customerInterval);
                isDayRunning = false;
                startBtn.disabled = false;
                startBtn.innerText = "Начать день";
            }, 30000);
        });

        function spawnCustomer() {
            const customer = document.createElement('div');
            customer.classList.add('customer');
            
            // Появляемся справа за экраном
            customer.style.left = '100%'; 
            entitiesLayer.appendChild(customer);

            // Начинаем движение влево к прилавку
            // Используем requestAnimationFrame для плавного старта транзишена
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    customer.style.left = '50%'; 
                });
            });

            // Ждем 2 секунды (время анимации), затем обслуживаем
            setTimeout(() => {
                serveCustomer(customer);
            }, 2050);
        }

        function serveCustomer(customer) {
            // 1. Ставим стакан на прилавок
            const cup = document.createElement('div');
            cup.classList.add('cup');
            cup.style.left = 'calc(50% + 10px)'; // Рядом с покупателем
            entitiesLayer.appendChild(cup);

            // 2. Через секунду покупатель забирает стакан
            setTimeout(() => {
                cup.remove(); 
                
                // 3. Начисляем деньги
                const price = 15;
                balance += price;
                balanceEl.innerText = balance;
                showFloatingText(price);

                // 4. Покупатель уходит
                customer.style.left = '-20%'; 

                // Удаляем элемент из DOM после ухода
                setTimeout(() => {
                    customer.remove();
                }, 2100);

            }, 1000);
        }

        function showFloatingText(amount) {
            const text = document.createElement('div');
            text.classList.add('floating-text');
            text.innerText = '+' + amount + '$';
            text.style.left = 'calc(50% + 5px)';
            text.style.bottom = '120px'; // Над прилавком
            entitiesLayer.appendChild(text);

            setTimeout(() => {
                text.remove();
            }, 1500);
        }
    </script>
</body>
</html>
